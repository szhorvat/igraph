name: Solaris

on:
  push:
    branches: [ 'ci/solaris' ]
  workflow_dispatch:

jobs:
  solaris:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '11.4-gcc-14'
            cc: gcc
            cxx: g++
          - release: '11.4-clang-19'
            cc: clang
            cxx: clang++
    name: solaris (${{ matrix.release }})
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # git inside the VM fails on the synced checkout (ownership), so record
      # the version here
      - name: Write IGRAPH_VERSION
        run: git describe --tags --abbrev=9 | sed 's/^v//' > IGRAPH_VERSION && cat IGRAPH_VERSION
      - name: Build and test in Solaris
        uses: vmactions/solaris-vm@v1
        with:
          release: ${{ matrix.release }}
          usesh: true
          prepare: |
            pkg install -v developer/build/cmake developer/parser/bison developer/lexer/flex developer/build/gnu-make library/libxml2 library/gmp developer/versioning/git || true
          run: |
            set -e
            cat /etc/release
            uname -a
            ${{ matrix.cc }} --version
            ${{ matrix.cxx }} --version
            cmake --version
            echo '=== longjmp in headers'
            grep -n 'longjmp\|NORETURN\|does_not_return\|redefine_extname' /usr/include/setjmp.h /usr/include/iso/setjmp_iso.h || true
            grep -n 'NORETURN' /usr/include/sys/ccompile.h || true
            for d in "" "-D_POSIX_C_SOURCE=200809L"; do for std in c99 c11; do echo "=== ${{ matrix.cc }} -std=$std $d -E"; printf '#include <setjmp.h>\n' | ${{ matrix.cc }} -std=$std $d -E - | grep -n 'longjmp' || true; done; done
            printf '#include <setjmp.h>\njmp_buf b;\n__attribute__((__noreturn__)) void f(void) { longjmp(b, 1); }\n' > nr.c
            for d in "" "-D_POSIX_C_SOURCE=200809L"; do for std in c99 gnu99 c11; do echo "=== compile test -std=$std $d"; ${{ matrix.cc }} -std=$std $d -Wall -c nr.c -o nr.o || true; done; done
            exit 0
            mkdir build && cd build
            cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo \
              -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} \
              -DCMAKE_MAKE_PROGRAM=gmake \
              -DIGRAPH_USE_INTERNAL_BLAS=ON -DIGRAPH_USE_INTERNAL_LAPACK=ON \
              -DIGRAPH_USE_INTERNAL_ARPACK=ON -DIGRAPH_USE_INTERNAL_GLPK=ON \
              -DIGRAPH_USE_INTERNAL_PLFIT=ON -DIGRAPH_USE_INTERNAL_GMP=ON \
              -DIGRAPH_VERIFY_FINALLY_STACK=ON
            rc=0; gmake -k -j4 build_tests > build.log 2>&1 || rc=$?
            echo "build exit code: $rc"
            grep 'warning:' build.log | sort | uniq -c | sort -rn | head -100 || true
            grep 'error' build.log | sort | uniq -c | head -100 || true
            [ $rc -eq 0 ]
            OMP_NUM_THREADS=1 ctest -j4 --output-on-failure --timeout 600
