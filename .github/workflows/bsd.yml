# Temporary portability workflow for BSD and illumos systems (not for merging).
name: BSD

on:
  push:
    branches: [ 'ci/bsd' ]
  workflow_dispatch:

env:
  VENDORED: >-
    -DIGRAPH_USE_INTERNAL_BLAS=ON -DIGRAPH_USE_INTERNAL_LAPACK=ON
    -DIGRAPH_USE_INTERNAL_ARPACK=ON -DIGRAPH_USE_INTERNAL_GLPK=ON
    -DIGRAPH_USE_INTERNAL_GMP=ON -DIGRAPH_USE_INTERNAL_PLFIT=ON

jobs:
  freebsd:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: '14.5'
            arch: x86_64
            configs: 'vendored system'
          - release: '15.1'
            arch: x86_64
            configs: 'vendored system'
    name: freebsd-${{ matrix.release }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Write IGRAPH_VERSION
        run: git describe --tags --abbrev=9 | sed 's/^v//' > IGRAPH_VERSION && cat IGRAPH_VERSION
      - uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          envs: 'VENDORED'
          copyback: false
          prepare: |
            for p in cmake ninja bison flex libxml2 gmp glpk arpack-ng openblas; do pkg install -y $p || echo "PACKAGE $p NOT INSTALLED"; done
          run: |
            freebsd-version; uname -a; cc --version; c++ --version | head -1
            sh .github/bsd-probe.sh

  openbsd:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    name: openbsd-8.0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Write IGRAPH_VERSION
        run: git describe --tags --abbrev=9 | sed 's/^v//' > IGRAPH_VERSION && cat IGRAPH_VERSION
      - uses: vmactions/openbsd-vm@v1
        with:
          release: '8.0'
          envs: 'VENDORED'
          copyback: false
          prepare: |
            for p in cmake ninja bison libxml gmp glpk arpack lapack; do pkg_add -I $p || echo "PACKAGE $p NOT INSTALLED"; done
          run: |
            uname -a; cc --version; c++ --version | head -1
            sh .github/bsd-probe.sh

