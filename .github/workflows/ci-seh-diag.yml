name: SEH xmm diag

on:
  push:
    branches:
      - 'ci/seh-xmm-diag'

jobs:
  diag:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-clang
          update: true
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          gcc --version | head -1; clang --version | head -1
          pacman -Q mingw-w64-ucrt-x86_64-headers 2>/dev/null || true
          echo '#include <setjmp.h>' | gcc -E -dM - | grep -E 'define (setjmp|longjmp)\b' || true
          echo '#include <setjmp.h>' | clang -E -dM - | grep -E 'define (setjmp|longjmp)\b' || true
          echo "--- GCC prologue of victim(), FRAME=3000"
          gcc -O2 -S -DFRAME=3000 ci-seh/sehdiag.c -o - | awk '/seh_proc\tvictim/,/seh_endprologue/'
          echo "--- Clang prologue of victim(), FRAME=3000"
          clang -O2 -S -DFRAME=3000 ci-seh/sehdiag.c -o - | awk '/^victim:/,/seh_endprologue/'
      - name: GCC, xmm6 saved, various frame sizes
        run: |
          for f in 256 1024 2048 3072 4096 6144; do ci-seh/run.sh gcc$f 100 gcc -DFRAME=$f; done
      - name: Controls
        run: |
          ci-seh/run.sh gcc_noxmm 100 gcc -DFRAME=6144 -DNO_XMM
          ci-seh/run.sh gcc_nonseh 100 gcc -DFRAME=6144 -D__USE_MINGW_SETJMP_NON_SEH
          ci-seh/run.sh clang 100 clang -DFRAME=6144
          ci-seh/run.sh clang_small 100 clang -DFRAME=1024
