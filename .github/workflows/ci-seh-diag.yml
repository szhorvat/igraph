name: SEH xmm diag

on:
  push:
    branches:
      - 'ci/seh-xmm-diag'

jobs:
  diag:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-clang
          update: true
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          gcc --version | head -1; clang --version | head -1
          pacman -Q mingw-w64-ucrt-x86_64-headers 2>/dev/null || true
          echo '#include <setjmp.h>' | gcc -E -dM - | grep -E 'define (setjmp|longjmp)\b' || true
          echo '#include <setjmp.h>' | clang -E -dM - | grep -E 'define (setjmp|longjmp)\b' || true
          echo "--- GCC prologue of victim(), FRAME=3000"
          gcc -O2 -S -DFRAME=3000 ci-seh/sehdiag.c -o - | awk '/seh_proc\tvictim/,/seh_endprologue/'
          echo "--- Clang prologue of victim(), FRAME=3000"
          clang -O2 -S -DFRAME=3000 ci-seh/sehdiag.c -o - | awk '/^victim:/,/seh_endprologue/'
      - name: New mingw-w64 setjmp macro
        run: |
          gcc -O2 -S -DFRAME=3000 -DNEW_MACRO ci-seh/sehdiag.c -o - | awk '/seh_proc\tvictim/,/seh_endprologue/'
          ci-seh/run.sh gcc_new3072 200 gcc -DFRAME=3072 -DNEW_MACRO
          ci-seh/run.sh gcc_new1536 200 gcc -DFRAME=1536 -DNEW_MACRO
